name: links

# A profile README is mostly third-party URLs, and those rot silently — a badge
# whose host disappears renders as a broken image, not an error. Weekly is
# often enough to catch it before a visitor does.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 tools/check_links.py
