name: contribution graph

# Redraws assets/contributions-*.png once a day and commits it if it changed.
#
# It needs CONTRIB_TOKEN: a personal access token with `read:user`. The token
# Actions provides by default is scoped to this repository and cannot see the
# account's private contributions, which are most of them — that is exactly the
# blind spot this graph exists to close. Without the secret the job says so and
# stops, rather than quietly committing a graph that undercounts by two orders
# of magnitude.

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  draw:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for the token
        env:
          GH_TOKEN: ${{ secrets.CONTRIB_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::CONTRIB_TOKEN is not set — skipping. Create a token"
            echo "::warning::with read:user and add it under Settings > Secrets."
            echo "skip=true" >> "$GITHUB_ENV"
          fi

      - name: Install the renderer and a font
        if: env.skip != 'true'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq librsvg2-bin fonts-liberation

      - name: Draw
        if: env.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.CONTRIB_TOKEN }}
        run: python3 tools/build_contributions.py

      - name: Commit if it changed
        if: env.skip != 'true'
        run: |
          if git diff --quiet -- assets; then
            echo "no change"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/contributions-light.svg assets/contributions-light.png \
                  assets/contributions-dark.svg assets/contributions-dark.png
          git commit -m "Redraw the contribution graph"
          git push
