<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="418" viewBox="0 0 1200 418" role="img">
<rect width="1200" height="418" fill="#0d1117"/>
<text x="24" y="34" font-family="Helvetica Neue" font-size="16" font-weight="600" fill="#e6edf3">Four layers, in order</text>
<text x="24" y="56" font-family="Helvetica Neue" font-size="13.5" font-weight="400" fill="#9198a1">each one is only meaningful once the one above it holds</text>
<rect x="24" y="87" width="22" height="22" rx="5" fill="#151b23" stroke="#3d444d" stroke-width="1"/>
<text x="35" y="103" font-family="Helvetica Neue" font-size="12.5" font-weight="600" fill="#9198a1" text-anchor="middle">1</text>
<text x="60" y="102" font-family="Helvetica Neue" font-size="14.5" font-weight="600" fill="#e6edf3">Graph correctness</text>
<text x="60" y="123" font-family="Helvetica Neue" font-size="13" font-weight="400" fill="#9198a1">is what we stored true, sourced, current?</text>
<rect x="24" y="161" width="22" height="22" rx="5" fill="#151b23" stroke="#3d444d" stroke-width="1"/>
<text x="35" y="177" font-family="Helvetica Neue" font-size="12.5" font-weight="600" fill="#9198a1" text-anchor="middle">2</text>
<text x="60" y="176" font-family="Helvetica Neue" font-size="14.5" font-weight="600" fill="#e6edf3">Ontology hygiene</text>
<text x="60" y="197" font-family="Helvetica Neue" font-size="13" font-weight="400" fill="#9198a1">is the schema consistent, and does it answer what it was built for?</text>
<rect x="24" y="235" width="22" height="22" rx="5" fill="#151b23" stroke="#3d444d" stroke-width="1"/>
<text x="35" y="251" font-family="Helvetica Neue" font-size="12.5" font-weight="600" fill="#9198a1" text-anchor="middle">3</text>
<text x="60" y="250" font-family="Helvetica Neue" font-size="14.5" font-weight="600" fill="#e6edf3">Answer groundedness</text>
<text x="60" y="271" font-family="Helvetica Neue" font-size="13" font-weight="400" fill="#9198a1">does every claim trace to a source that carries it?</text>
<rect x="24" y="309" width="22" height="22" rx="5" fill="#151b23" stroke="#3d444d" stroke-width="1"/>
<text x="35" y="325" font-family="Helvetica Neue" font-size="12.5" font-weight="600" fill="#9198a1" text-anchor="middle">4</text>
<text x="60" y="324" font-family="Helvetica Neue" font-size="14.5" font-weight="600" fill="#e6edf3">Baseline comparison</text>
<text x="60" y="345" font-family="Helvetica Neue" font-size="13" font-weight="400" fill="#9198a1">better than a plain model and ordinary RAG?</text>
<rect x="660" y="86" width="516" height="288" rx="6" fill="#0d1117" stroke="#3d444d" stroke-width="1"/>
<rect x="660" y="86" width="516" height="40" rx="6" fill="#151b23"/>
<rect x="660" y="120" width="516" height="6" fill="#151b23"/>
<line x1="660" y1="126" x2="1176" y2="126" stroke="#3d444d" stroke-width="1"/>
<text x="676" y="112" font-family="Helvetica Neue" font-size="13.5" font-weight="600" fill="#e6edf3">Release gate</text>
<text x="1160" y="112" font-family="Helvetica Neue" font-size="12.5" font-weight="400" fill="#9198a1" text-anchor="end">example run · 4 layers · 12 checks</text>
<rect x="676" y="142" width="78" height="21" rx="10" fill="#282215" stroke="#d29922" stroke-width="1"/>
<text x="715" y="157" font-family="Helvetica Neue" font-size="11.5" font-weight="600" fill="#d29922" text-anchor="middle">BLOCKED</text>
<text x="764" y="157" font-family="Helvetica Neue" font-size="13" font-weight="400" fill="#e6edf3">by three named checks</text>
<line x1="677" y1="181" x2="677" y2="193" stroke="#d29922" stroke-width="3"/>
<text x="690" y="191" font-family="Helvetica Neue" font-size="13" font-weight="400" fill="#e6edf3">provenance coverage</text>
<text x="1058" y="191" font-family="Menlo" font-size="13" font-weight="600" fill="#e6edf3" text-anchor="end">0.80</text>
<text x="1160" y="191" font-family="Helvetica Neue" font-size="12.5" font-weight="400" fill="#9198a1" text-anchor="end">needs ≥ 0.95</text>
<line x1="677" y1="214" x2="677" y2="226" stroke="#d29922" stroke-width="3"/>
<text x="690" y="224" font-family="Helvetica Neue" font-size="13" font-weight="400" fill="#e6edf3">citation precision</text>
<text x="1058" y="224" font-family="Menlo" font-size="13" font-weight="600" fill="#e6edf3" text-anchor="end">0.60</text>
<text x="1160" y="224" font-family="Helvetica Neue" font-size="12.5" font-weight="400" fill="#9198a1" text-anchor="end">needs ≥ 0.90</text>
<line x1="677" y1="247" x2="677" y2="259" stroke="#d29922" stroke-width="3"/>
<text x="690" y="257" font-family="Helvetica Neue" font-size="13" font-weight="400" fill="#e6edf3">unsupported rate</text>
<text x="1058" y="257" font-family="Menlo" font-size="13" font-weight="600" fill="#e6edf3" text-anchor="end">0.40</text>
<text x="1160" y="257" font-family="Helvetica Neue" font-size="12.5" font-weight="400" fill="#9198a1" text-anchor="end">needs ≤ 0.05</text>
<text x="676" y="303" font-family="Helvetica Neue" font-size="13" font-weight="400" fill="#9198a1">while passing both baselines</text>
<circle cx="681" cy="328" r="4" fill="#3fb950"/>
<text x="694" y="333" font-family="Helvetica Neue" font-size="13" font-weight="400" fill="#e6edf3">beats a plain model</text>
<text x="1058" y="333" font-family="Menlo" font-size="13" font-weight="600" fill="#e6edf3" text-anchor="end">0.71</text>
<circle cx="681" cy="358" r="4" fill="#3fb950"/>
<text x="694" y="363" font-family="Helvetica Neue" font-size="13" font-weight="400" fill="#e6edf3">beats standard RAG</text>
<text x="1058" y="363" font-family="Menlo" font-size="13" font-weight="600" fill="#e6edf3" text-anchor="end">0.58</text>
<text x="24" y="400" font-family="Helvetica Neue" font-size="13" font-weight="400" fill="#6e7681">No weighted mean: a 0.91 composite can hide a 0.40 unsupported-claim rate, so the gate names its blockers.</text>
</svg>
