<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="392" viewBox="0 0 1200 392" role="img">
<rect width="1200" height="392" fill="#ffffff"/>
<text x="24" y="34" font-family="Helvetica Neue" font-size="16" font-weight="600" fill="#1f2328">Where a classifier gets it wrong</text>
<text x="24" y="56" font-family="Helvetica Neue" font-size="13.5" font-weight="400" fill="#59636e">1,460 houses, labelled expensive above $250,580 — both error groups sit next to that line</text>
<rect x="599.0" y="190" width="169.9" height="92" fill="#fff8c5" fill-opacity="0.75"/>
<line x1="96" y1="232" x2="1120" y2="232" stroke="#d1d9e0" stroke-width="1"/>
<line x1="684.0" y1="140" x2="684.0" y2="300" stroke="#9a6700" stroke-width="1.5" stroke-dasharray="4 4"/>
<text x="683.9710476190476" y="132" font-family="Helvetica Neue" font-size="12.5" font-weight="600" fill="#9a6700" text-anchor="middle">cutoff $250,580</text>
<text x="437.3333333333333" y="254" font-family="Helvetica Neue" font-size="12" font-weight="400" fill="#818b98" text-anchor="middle">$200k</text>
<text x="924.952380952381" y="254" font-family="Helvetica Neue" font-size="12" font-weight="400" fill="#818b98" text-anchor="middle">$300k</text>
<circle cx="193.0" cy="232" r="36.8" fill="#818b98" fill-opacity="0.35"/>
<text x="193.03619047619048" y="294.7799877650877" font-family="Helvetica Neue" font-size="14" font-weight="600" fill="#1f2328" text-anchor="middle">correctly called cheap</text>
<text x="193.03619047619048" y="314.7799877650877" font-family="Helvetica Neue" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="middle">1,227 houses</text>
<circle cx="1022.5" cy="232" r="13.2" fill="#0969da" fill-opacity="0.9"/>
<text x="1022.4761904761905" y="271.2399962235644" font-family="Helvetica Neue" font-size="14" font-weight="600" fill="#1f2328" text-anchor="middle">correctly called expensive</text>
<text x="1022.4761904761905" y="291.2399962235644" font-family="Helvetica Neue" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="middle">159 houses</text>
<circle cx="625.1" cy="232" r="4.2" fill="#9a6700" fill-opacity="0.9"/>
<line x1="625.1" y1="223.8" x2="625.1" y2="178" stroke="#9a6700" stroke-width="1"/>
<text x="613.0666666666667" y="170" font-family="Helvetica Neue" font-size="14" font-weight="600" fill="#1f2328" text-anchor="end">false alarm</text>
<text x="613.0666666666667" y="190" font-family="Helvetica Neue" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="end">16 houses · $12,080 below</text>
<circle cx="768.9" cy="232" r="8.0" fill="#9a6700" fill-opacity="0.9"/>
<line x1="768.9" y1="220.0" x2="768.9" y2="178" stroke="#9a6700" stroke-width="1"/>
<text x="780.9142857142857" y="170" font-family="Helvetica Neue" font-size="14" font-weight="600" fill="#1f2328">missed</text>
<text x="780.9142857142857" y="190" font-family="Helvetica Neue" font-size="12.5" font-weight="400" fill="#59636e">58 houses · $17,420 above</text>
<text x="24" y="374" font-family="Helvetica Neue" font-size="13" font-weight="400" fill="#818b98">Predicting the price and applying the rule afterwards beats classifying directly: F1 0.843 against 0.813 over the same 20 folds, p = 0.0098.</text>
</svg>
