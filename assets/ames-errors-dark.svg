<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="452" viewBox="0 0 1200 452" role="img">
<rect width="1200" height="452" fill="#0D0F1A"/>
<text x="56" y="52" font-family="Bricolage Grotesque" font-size="31" font-weight="300" fill="#E8EDF5">Where a classifier gets it wrong</text>
<text x="56" y="80" font-family="Bricolage Grotesque" font-size="16.5" font-weight="400" fill="#98A1BC">1,460 houses, labelled “expensive” above $250,580 — every mistake sits next to that line</text>
<rect x="602.9" y="152" width="172.5" height="212" fill="#6B5BCD" opacity="0.09"/>
<line x1="92" y1="258" x2="1132" y2="258" stroke="#272C45" stroke-width="1.5"/>
<line x1="689.2" y1="140" x2="689.2" y2="376" stroke="#6B5BCD" stroke-width="1.6" stroke-dasharray="5 5"/>
<text x="689.1580952380951" y="132" font-family="Bricolage Grotesque" font-size="15" font-weight="600" fill="#6B5BCD" text-anchor="middle">cutoff  $250,580</text>
<line x1="438.7" y1="258" x2="438.7" y2="264" stroke="#272C45" stroke-width="1.5"/>
<text x="438.66666666666663" y="284" font-family="Bricolage Grotesque" font-size="14" font-weight="400" fill="#6C7593" text-anchor="middle">$200k</text>
<line x1="933.9" y1="258" x2="933.9" y2="264" stroke="#272C45" stroke-width="1.5"/>
<text x="933.9047619047619" y="284" font-family="Bricolage Grotesque" font-size="14" font-weight="400" fill="#6C7593" text-anchor="middle">$300k</text>
<circle cx="190.6" cy="258" r="41.3" fill="#6C7593" opacity="0.30"/>
<text x="190.55238095238093" y="329.3337005360033" font-family="Bricolage Grotesque" font-size="17" font-weight="600" fill="#E8EDF5" text-anchor="middle">correctly called cheap</text>
<text x="190.55238095238093" y="351.3337005360033" font-family="Bricolage Grotesque" font-size="14.5" font-weight="400" fill="#98A1BC" text-anchor="middle">1,227 houses</text>
<circle cx="1033.0" cy="258" r="14.9" fill="#4B6EF5" opacity="0.85"/>
<text x="1032.952380952381" y="302.87923385124384" font-family="Bricolage Grotesque" font-size="17" font-weight="600" fill="#E8EDF5" text-anchor="middle">correctly called expensive</text>
<text x="1032.952380952381" y="324.87923385124384" font-family="Bricolage Grotesque" font-size="14.5" font-weight="400" fill="#98A1BC" text-anchor="middle">159 houses</text>
<circle cx="629.3" cy="258" r="4.7" fill="#6B5BCD" opacity="1"/>
<line x1="629.3" y1="249.3" x2="629.3" y2="196" stroke="#6B5BCD" stroke-width="1.2"/>
<text x="615.3333333333334" y="186" font-family="Bricolage Grotesque" font-size="17" font-weight="600" fill="#E8EDF5" text-anchor="end">false alarm</text>
<text x="615.3333333333334" y="208" font-family="Bricolage Grotesque" font-size="14.5" font-weight="400" fill="#98A1BC" text-anchor="end">16 houses  ·  $12,080 below</text>
<circle cx="775.4" cy="258" r="9.0" fill="#6B5BCD" opacity="1"/>
<line x1="775.4" y1="245.0" x2="775.4" y2="196" stroke="#6B5BCD" stroke-width="1.2"/>
<text x="789.4285714285714" y="186" font-family="Bricolage Grotesque" font-size="17" font-weight="600" fill="#E8EDF5">missed</text>
<text x="789.4285714285714" y="208" font-family="Bricolage Grotesque" font-size="14.5" font-weight="400" fill="#98A1BC">58 houses  ·  $17,420 above</text>
<text x="56" y="424" font-family="Bricolage Grotesque" font-size="16" font-weight="400" fill="#6C7593">Predicting the price and applying the rule afterwards beats classifying directly: F1 0.843 against 0.813 over the same 20 folds, p = 0.0098.</text>
</svg>
